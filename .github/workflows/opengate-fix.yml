# Builds Open Gate Fix for macOS, Windows and Linux.
# Run it by pushing a tag `open-gate-fix-v*`. One file per platform, named
# open-gate-fix-<platform>-<version>, is attached to one draft release for that tag (release assets, not workflow artifacts, so the
# Actions artifact storage quota does not matter).
name: opengate-fix

on:
  push:
    tags: ["open-gate-fix-v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

defaults:
  run:
    working-directory: opengate-fix

jobs:
  # Creates the draft release once, before the builds start. (When each build
  # job created it, three jobs starting together made three drafts.)
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it is not there yet
        working-directory: .
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Open Gate Fix ${TAG#open-gate-fix-}" --notes "Builds for macOS, Windows and Linux."

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag (open-gate-fix-v0.1.0 -> v0.1.0)
        shell: bash
        run: echo "VERSION=${TAG#open-gate-fix-}" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: ./scripts/bundle-macos.sh
      - run: |
          cp dist/OpenGateFix-macos.zip "open-gate-fix-macos-$VERSION.zip"
          gh release upload "$TAG" "open-gate-fix-macos-$VERSION.zip" --clobber

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag (open-gate-fix-v0.1.0 -> v0.1.0)
        shell: bash
        run: echo "VERSION=${TAG#open-gate-fix-}" >> "$GITHUB_ENV"
      - run: cargo build --release
      - shell: bash
        run: |
          cp target/release/opengate-fix.exe "open-gate-fix-windows-$VERSION.exe"
          gh release upload "$TAG" "open-gate-fix-windows-$VERSION.exe" --clobber

  linux:
    needs: release
    # Oldest available runner, so the binary also starts on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag (open-gate-fix-v0.1.0 -> v0.1.0)
        shell: bash
        run: echo "VERSION=${TAG#open-gate-fix-}" >> "$GITHUB_ENV"
      - run: cargo build --release
      - run: |
          tar -czf "open-gate-fix-linux-$VERSION.tar.gz" -C target/release opengate-fix
          gh release upload "$TAG" "open-gate-fix-linux-$VERSION.tar.gz" --clobber
